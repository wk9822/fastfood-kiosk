<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="page-transitions.js"></script>
</head>
<body>
    <header class="customer-header">
        <img src="brand-logo.png" alt="Brand Logo" class="brand-logo" id="customer-logo">
        <h1>Your Cart</h1>
    </header>

    <div class="cart-container">
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-summary">
            <div class="cart-total">
                Subtotal: $<span id="subtotal">0.00</span><br>
                Tax (<span id="tax-rate">10</span>%): $<span id="tax-amount">0.00</span><br>
                <strong>Total: $<span id="total-price">0.00</span></strong>
            </div>
            <button id="checkout-btn" class="btn-primary">Proceed to Payment</button>
            <a href="index.html" class="btn-secondary" onclick="event.preventDefault(); navigateWithFade('index.html');">Back to Menu</a>
        </div>
    </div>

    <!-- Edit Extras Modal -->
    <div class="edit-extras-modal" id="edit-extras-modal">
        <div class="edit-extras-content">
            <span class="edit-extras-close">&times;</span>
            <h2 id="edit-extras-title">Edit Extras</h2>
            <div id="edit-extras-options"></div>
            <div class="edit-extras-unit-price">
                <span>New unit price:</span>
                <strong id="edit-extras-price">$0.00</strong>
            </div>
            <button id="edit-extras-save-btn" class="btn-primary">Save</button>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
