<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff6b00',
                        'primary-hover': '#e05d00'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="customer-header">
        <img src="brand-logo.png" alt="Brand Logo" class="brand-logo" id="kitchen-logo">
        <h1>Kitchen Display</h1>
    </header>

    <main class="px-4 py-6 md:px-8">
        <div class="max-w-6xl mx-auto grid gap-6 md:grid-cols-2" id="orders-container">
            <!-- In Process Column -->
            <section class="rounded-2xl bg-white shadow-sm border border-slate-100 flex flex-col min-h-[320px]">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h2 class="text-sm font-semibold tracking-wide text-slate-700 uppercase">In Process</h2>
                    <span class="text-xs text-slate-400" id="count-preparing">0 orders</span>
                </div>
                <div class="flex-1 overflow-auto p-4 space-y-3" id="preparing-list">
                    <p class="text-sm text-slate-400 text-center mt-6">No orders in process</p>
                </div>
            </section>

            <!-- Ready to Pick Up Column -->
            <section class="rounded-2xl bg-white shadow-sm border border-slate-100 flex flex-col min-h-[320px]">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                    <h2 class="text-sm font-semibold tracking-wide text-slate-700 uppercase">Ready to Pick Up</h2>
                    <span class="text-xs text-slate-400" id="count-ready">0 orders</span>
                </div>
                <div class="flex-1 overflow-auto p-4 space-y-3" id="ready-list">
                    <p class="text-sm text-slate-400 text-center mt-6">No ready orders</p>
                </div>
            </section>
        </div>
    </main>

    <script src="kitchen-display.js"></script>
</body>
</html>
