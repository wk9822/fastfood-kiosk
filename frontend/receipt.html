<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="page-transitions.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print\:max-w-receipt { max-width: 80mm; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-orange-50 to-amber-100 flex items-center justify-center p-4 print:p-0 print:bg-white">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl overflow-hidden print:shadow-none print:rounded-none print:max-w-receipt">
        <!-- Header stripe -->
        <div class="bg-gradient-to-r from-orange-500 to-amber-500 px-6 py-5 text-center">
            <div class="text-orange-100 text-sm font-medium uppercase tracking-wider">Order Receipt</div>
            <div class="text-white text-xl font-bold mt-1">#<span id="order-id"></span></div>
            <div id="order-type" class="text-orange-100 text-sm mt-2 inline-block px-3 py-1 rounded-full bg-white/20"></div>
            <div id="order-time" class="text-orange-100 text-xs mt-2"></div>
        </div>

        <!-- Items -->
        <div class="px-6 py-5" id="receipt-items"></div>

        <!-- Total section -->
        <div class="border-t-2 border-dashed border-gray-200 mx-6 pt-4">
            <div class="flex justify-between items-center text-lg font-bold">
                <span class="text-gray-700">Total</span>
                <span class="text-orange-600">$<span id="receipt-total">0.00</span></span>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-6 py-6 text-center">
            <p class="text-gray-600 font-medium mb-5">Thank you for your order!</p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center no-print">
                <button onclick="window.print()" class="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all">
                    Print Receipt
                </button>
                <a href="index.html" onclick="event.preventDefault(); navigateWithFade('index.html');" class="px-6 py-3 border-2 border-orange-500 text-orange-600 hover:bg-orange-50 font-semibold rounded-xl transition-all text-center">
                    New Order
                </a>
            </div>
        </div>
    </div>

    <script src="receipt.js"></script>
</body>
</html>
